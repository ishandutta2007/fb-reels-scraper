<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 250px;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      margin: 0;
      color: #1c1e21;
    }
    .header {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 8px;
      color: #1877f2;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .connected {
      background-color: #e7f3ff;
      color: #1877f2;
    }
    .disconnected {
      background-color: #fce8e6;
      color: #c5221f;
    }
    .status-text {
      color: #65676b;
      line-height: 1.4;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="header">FB Reels Scraper Bridge</div>
  <div id="badge" class="badge disconnected">Checking status...</div>
  <div id="status" class="status-text">
    Make sure you have a Facebook tab open and run <code>python fb-reels-scraper.py</code>.
  </div>
  <script src="popup.js"></script>
</body>
</html>
