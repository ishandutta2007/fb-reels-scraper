<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="reelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <linearGradient id="glowPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <!-- Filter for Neon Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes floatLeft {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1.5deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes floatRight {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(12px) rotate(-1.5deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.08); }
      }
      @keyframes dataFlow {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .floating-card-1 {
        animation: floatLeft 6s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatRight 7s ease-in-out infinite;
      }
      .orb-pulse {
        transform-origin: center;
        animation: pulseGlow 5s ease-in-out infinite;
      }
      .flow-line {
        stroke-dasharray: 8 12;
        animation: dataFlow 2.5s linear infinite;
      }
      .spin-icon {
        transform-origin: 1060px 100px;
        animation: spinSlow 20s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Ambient Glowing Orbs in Background -->
  <circle cx="180" cy="100" r="140" fill="#38bdf8" opacity="0.12" filter="url(#softGlow)" class="orb-pulse"/>
  <circle cx="1020" cy="300" r="160" fill="#c084fc" opacity="0.15" filter="url(#softGlow)" class="orb-pulse" style="animation-delay: -2.5s;"/>
  <circle cx="600" cy="50" r="110" fill="#ec4899" opacity="0.08" filter="url(#softGlow)"/>

  <!-- Dynamic Connecting Stream Lines (Behind Text) -->
  <path d="M 120 210 C 300 130, 450 280, 600 210 C 750 140, 900 290, 1080 210" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.35" class="flow-line" />
  <path d="M 120 230 C 320 310, 480 150, 600 220 C 720 290, 880 130, 1080 220" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.25" class="flow-line" style="animation-direction: reverse; animation-duration: 3.5s;" />

  <!-- Animated Background Deco Card 1 (Left Floating) -->
  <g class="floating-card-1" opacity="0.75">
    <rect x="70" y="60" width="180" height="90" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1.5" />
    <circle cx="100" cy="90" r="14" fill="url(#reelGrad)"/>
    <polygon points="97,84 107,90 97,96" fill="#ffffff"/>
    <rect x="125" y="82" width="95" height="7" rx="3.5" fill="#e2e8f0" opacity="0.8"/>
    <rect x="125" y="95" width="65" height="5" rx="2.5" fill="#94a3b8" opacity="0.6"/>
    <rect x="90" y="120" width="140" height="15" rx="7.5" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" opacity="0.9"/>
    <text x="160" y="131" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#38bdf8" font-weight="600" text-anchor="middle">ws://127.0.0.1:8765</text>
  </g>

  <!-- Animated Background Deco Card 2 (Right Floating) -->
  <g class="floating-card-2" opacity="0.75">
    <rect x="950" y="270" width="190" height="95" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1.5" />
    <circle cx="980" cy="300" r="10" fill="#22c55e" opacity="0.8"/>
    <text x="1000" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#4ade80" font-weight="700">EXTRACTED</text>
    <rect x="970" y="322" width="150" height="6" rx="3" fill="#cbd5e1" opacity="0.7"/>
    <rect x="970" y="334" width="115" height="6" rx="3" fill="#94a3b8" opacity="0.5"/>
    <rect x="970" y="346" width="80" height="6" rx="3" fill="#64748b" opacity="0.4"/>
  </g>

  <!-- Subtle Animated Spinning Tech Ring in Top Right -->
  <g class="spin-icon" opacity="0.25">
    <circle cx="1060" cy="100" r="45" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="8 6"/>
    <circle cx="1060" cy="100" r="30" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8"/>
  </g>

  <!-- ================= FOREGROUND (HIGH CONTRAST & CLEARLY VISIBLE) ================= -->

  <!-- Top Category / Protocol Badge -->
  <g transform="translate(600, 75)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" fill-opacity="0.95" stroke="#38bdf8" stroke-width="1.2" filter="url(#neonGlow)"/>
    <circle cx="-115" cy="0" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="-98" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e0f2fe" letter-spacing="1.5">BROWSER WEBSOCKET BRIDGE</text>
  </g>

  <!-- Primary Main Title -->
  <g transform="translate(600, 160)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5" filter="url(#neonGlow)">
      FB REELS SCRAPER
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(600, 215)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
      Full Description &amp; Caption Harvester Using Active Browser Sessions
    </text>
  </g>

  <!-- Feature Pills Badges Row -->
  <g transform="translate(600, 280)">
    <!-- Pill 1: No Bot Detection -->
    <g transform="translate(-320, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">🛡️ Zero Bot Check</text>
    </g>

    <!-- Pill 2: Two-Phase Scrape -->
    <g transform="translate(-110, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#a78bfa">⚡ 2-Stage Extract</text>
    </g>

    <!-- Pill 3: Auto Un-truncate -->
    <g transform="translate(100, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f472b6">🔍 Auto "See More"</text>
    </g>

    <!-- Pill 4: Smart Local Cache -->
    <g transform="translate(310, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#34d399">💾 Smart Cache</text>
    </g>
  </g>

  <!-- Bottom Terminal Command Highlight -->
  <g transform="translate(600, 355)">
    <rect x="-190" y="-18" width="380" height="36" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
    <text x="-165" y="5" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="13" fill="#64748b" font-weight="600">$</text>
    <text x="-145" y="5" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="13" fill="#f8fafc" font-weight="500">pip install fb-reels-scraper</text>
    <rect x="135" y="-10" width="35" height="20" rx="4" fill="#1e293b"/>
    <text x="152" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" font-weight="700">CLI</text>
  </g>

</svg>
